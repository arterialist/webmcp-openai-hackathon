<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="16" fill="#121815"/>
  <!-- Top crown facet -->
  <polygon points="32,8 52,20 12,20" fill="#ffffff" fill-opacity="0.22" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linejoin="round"/>
  <!-- Left upper facet -->
  <polygon points="12,20 26,28 12,32" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right upper facet -->
  <polygon points="52,20 52,32 38,28" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linejoin="round"/>
  <!-- Left lower facet -->
  <polygon points="12,32 26,28 28,50 32,60" fill="#ffffff" fill-opacity="0.28" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right lower facet -->
  <polygon points="52,32 32,60 36,50 38,28" fill="#ffffff" fill-opacity="0.36" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linejoin="round"/>
  <!-- Glowing Center Emerald Core Facet -->
  <polygon points="32,20 38,28 36,50 32,60 28,50 26,28" fill="#00dc82" stroke="#00dc82" stroke-width="2" stroke-linejoin="round"/>
  <!-- Inner prism reflection highlight -->
  <polygon points="32,22 36,28 34,48 32,54" fill="#ffffff" fill-opacity="0.4"/>
</svg>
